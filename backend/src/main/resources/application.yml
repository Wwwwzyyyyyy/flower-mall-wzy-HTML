server:
  port: ${PORT:8080}
spring:
  web:
    resources:
      static-locations: classpath:/static/,file:../frontend/dist/
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 46MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  sql:
    init:
      mode: always
mybatis:
  configuration:
    map-underscore-to-camel-case: false
app:
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  jwt-secret: ${JWT_SECRET:}
  bootstrap-admin-password: ${ADMIN_PASSWORD:}
  seed-demo: ${SEED_DEMO:false}
  mock-refund-fail: ${MOCK_REFUND_FAIL:false}
  ai:
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    timeout-seconds: 25
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/flower;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
app:
  jwt-secret: local-only-flower-demo-secret-minimum-32-chars
  bootstrap-admin-password: Admin123!
  seed-demo: true
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/flower_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:flower}
    password: ${DB_PASSWORD:}
